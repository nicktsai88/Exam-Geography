<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地理科解析目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--ink:#49362f;--red:#ad3947;--cream:#fffaf4;--line:#eadbd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#eadfd5 1px,transparent 1px) 0 0/22px 22px,var(--cream);color:var(--ink);font-family:'Noto Sans TC',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d98672;outline-offset:2px}.wrap{max-width:1180px;margin:auto;padding:30px 20px 90px}header{text-align:center;padding:40px 14px 28px}header h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:.06em;margin:8px 0;color:#79313f}header p{color:#776760;margin:8px 0 20px}.pill{display:inline-block;border-radius:30px;background:white;border:1px solid var(--line);padding:8px 18px;font-weight:700}.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.btn{border:0;border-radius:12px;background:var(--red);color:white;padding:10px 17px;font-weight:700}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#fff;color:var(--red);border:1px solid #d7afb5}.btn.ghost{background:transparent;color:#725d56;padding:7px 10px}.search{padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:white;width:min(350px,100%)}.notice{font-size:.9rem;color:#826e66;text-align:center;margin:12px 0 34px}.group{margin:0 0 42px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}.group-head h2{font-size:1.45rem;margin:0}.group-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.count{font-size:.85rem;color:#806b63}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-top:5px solid #c46769;border-radius:15px;padding:18px;box-shadow:0 5px 15px #65402a12;min-height:145px;display:flex;flex-direction:column;gap:8px}.card.done{border-color:#66a780;border-top-color:#4b9a6a;background:#f5fff8}.card-title{font-size:1.18rem;font-weight:900;overflow-wrap:anywhere}.card a{color:#8e3047;font-weight:700;text-decoration:none;overflow-wrap:anywhere}.card a:hover{text-decoration:underline}.card-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:auto}.empty{border:2px dashed #dfcec0;border-radius:14px;padding:22px;color:#85736b;background:#fff9}.muted{color:#86766f;font-size:.88rem}.modal-back{position:fixed;inset:0;background:#201b1b9c;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:18px;padding:25px;width:min(460px,100%);box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 18px}.field{display:block;font-weight:700;margin:13px 0}.field input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #cabdb6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}footer{text-align:center;color:#8b7a72;font-size:.85rem}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#49362f;color:#fff;padding:10px 18px;border-radius:10px;z-index:20}#toast[hidden],.modal-back[hidden]{display:none}@media(max-width:600px){.wrap{padding:12px 15px 60px}header{padding-top:26px}.group-head{align-items:flex-start}.group-actions{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><header><div class="pill">📚 國中會考・地理科</div><h1>地理科解析目錄</h1><p>依題庫分類，快速找到每一回的解析教學</p><div class="pill" id="stats"></div><div class="toolbar"><button type="button" class="btn" id="addGroup">＋ 新增主要分類</button><input class="search" id="search" type="search" placeholder="🔎 搜尋分類或解析項目" aria-label="搜尋分類或解析項目"></div><div class="notice" id="syncStatus" role="status">☁️ 正在連線 Firebase…</div><div class="toolbar"><button type="button" class="btn secondary" id="signIn">使用 Google 登入</button><button type="button" class="btn secondary" id="signOut" hidden>登出</button><button type="button" class="btn secondary" id="migrate" hidden>上傳這台裝置舊資料</button></div><div class="toolbar"><button type="button" class="btn secondary" id="export">⬇ 匯出備份</button><button type="button" class="btn secondary" id="import">⬆ 匯入備份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header><div id="groups"></div><footer>✍️ 可新增分類與解析連結，也可標記完成進度</footer></main><div class="modal-back" id="modal" hidden><form class="modal" id="form"><h2 id="modalTitle"></h2><label class="field">名稱 <input id="name" maxlength="100" required placeholder="例如：第 1 回解析"></label><label class="field" id="urlField">解析網址或檔名（可稍後填寫）<input id="url" maxlength="2048" placeholder="例如：geography-01.html 或 https://..."></label><div class="modal-actions"><button class="btn secondary" type="button" id="cancel">取消</button><button class="btn" type="submit">儲存</button></div></form></div><div id="toast" role="status" hidden></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,setDoc} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
(()=>{'use strict';
const firebaseConfig={apiKey:"AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",authDomain:"chinese-learning-47f4d.firebaseapp.com",projectId:"chinese-learning-47f4d",storageBucket:"chinese-learning-47f4d.firebasestorage.app",messagingSenderId:"76289812052",appId:"1:76289812052:web:898384a916f9f341f62fc1"};
const COLLECTION_NAME='Exam-Geography';
const DOC_GLOBAL='global';
const KEY='geography-analysis-directory-v1';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,COLLECTION_NAME,DOC_GLOBAL);
let user=null,unsub=null,loaded=false,remoteExists=false,pending=Promise.resolve();
function status(message){$('#syncStatus').textContent=message}
function ready(){if(user&&loaded)return true;toast('請先登入並等待雲端資料載入');return false}
const defaults=['文揚題庫模擬考','3800模擬考','3688模擬考','115翰林【大滿貫(甲)】複習卷'].map((name,i)=>({id:'default-'+i,name,items:[]}));
const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function valid(data){return Array.isArray(data)&&data.length<=500&&data.every(g=>g&&typeof g.id==='string'&&typeof g.name==='string'&&g.name.length<=100&&Array.isArray(g.items)&&g.items.length<=2000&&g.items.every(i=>i&&typeof i.id==='string'&&typeof i.name==='string'&&i.name.length<=100&&typeof i.url==='string'&&i.url.length<=2048));}
let groups=defaults;let oldGroups=null;try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))oldGroups=saved}catch{}
let edit=null;let query='';const host=$('#groups');
function save(){const data=JSON.parse(JSON.stringify(groups));status('⏳ 正在同步雲端…');pending=pending.catch(()=>{}).then(()=>setDoc(ref,{groups:data,updatedAt:new Date().toISOString()})).then(()=>status('☁️ 已同步雲端')).catch(err=>{status('⚠️ 同步失敗：'+err.message);toast('雲端儲存失敗，請確認登入與 Firestore 規則')});return pending}
function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3500)}
function button(label,action,groupId,itemId,cls='ghost'){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=label;b.addEventListener('click',()=>action(groupId,itemId));return b}
function safeUrl(raw){const s=raw.trim();if(!s)return '';if(/[\u0000-\u001f\\]/.test(s)||s.startsWith('//'))return null;try{const u=new URL(s,location.href);if(['http:','https:'].includes(u.protocol))return s}catch{}return null}
function render(){host.replaceChildren();let total=0,done=0;const q=query.toLocaleLowerCase();for(const g of groups){total+=g.items.length;done+=g.items.filter(i=>i.done).length;const matched=g.name.toLocaleLowerCase().includes(q);const items=matched?g.items:g.items.filter(i=>i.name.toLocaleLowerCase().includes(q));if(q&&!matched&&!items.length)continue;const section=document.createElement('section');section.className='group';const head=document.createElement('div');head.className='group-head';const h=document.createElement('h2');h.textContent='📖 '+g.name;const actions=document.createElement('div');actions.className='group-actions';const count=document.createElement('span');count.className='count';count.textContent=`${g.items.length} 個項目`;actions.append(count,button('＋ 新增次要項目',openItem,g.id,null,'secondary'),button('編輯分類',openGroup,g.id),button('刪除分類',removeGroup,g.id));head.append(h,actions);section.append(head);const grid=document.createElement('div');grid.className='grid';if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=q?'沒有符合搜尋的項目':'尚無解析項目，點選「新增次要項目」開始建立。';grid.append(empty)}items.forEach(item=>{const card=document.createElement('article');card.className='card'+(item.done?' done':'');const title=document.createElement('div');title.className='card-title';title.textContent=item.name;card.append(title);const url=safeUrl(item.url);if(url){const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='🔗 開啟解析教學 ↗';card.append(link)}else{const hint=document.createElement('div');hint.className='muted';hint.textContent='尚未設定解析連結';card.append(hint)}const controls=document.createElement('div');controls.className='card-actions';controls.append(button(item.done?'✅ 已完成':'○ 標記完成',toggleDone,g.id,item.id),button('編輯',openItem,g.id,item.id),button('刪除',removeItem,g.id,item.id));card.append(controls);grid.append(card)});section.append(grid);host.append(section)}if(!host.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=query?'沒有符合搜尋的分類或項目':'尚無分類，點選「新增主要分類」開始建立。';host.append(empty)}$('#stats').textContent=`✅ 已完成 ${done} / ${total} 個解析項目`}
function group(id){return groups.find(g=>g.id===id)}
function open(kind,gid,iid){if(!ready())return;edit={kind,gid,iid};const g=group(gid),i=iid&&g?.items.find(x=>x.id===iid);$('#modalTitle').textContent=kind==='group'?(g?'編輯主要分類':'新增主要分類'):(i?'編輯次要項目':'新增次要項目');$('#name').value=kind==='group'?(g?.name||''):(i?.name||'');$('#url').value=i?.url||'';$('#urlField').hidden=kind==='group';$('#modal').hidden=false;$('#name').focus()}
function openGroup(gid){open('group',gid,null)}function openItem(gid,iid){open('item',gid,iid)}function close(){edit=null;$('#modal').hidden=true}
$('#form').addEventListener('submit',e=>{e.preventDefault();if(!edit||!ready())return;const name=$('#name').value.trim();if(!name)return;const {kind,gid,iid}=edit;if(kind==='group'){if(gid)group(gid).name=name;else groups.push({id:uid(),name,items:[]})}else{const g=group(gid);if(!g)return;const url=$('#url').value.trim();if(safeUrl(url)===null){toast('請填寫 http(s) 網址或同資料夾內的檔名');return}if(iid){const i=g.items.find(x=>x.id===iid);i.name=name;i.url=url}else g.items.push({id:uid(),name,url,done:false})}save();close();render()});
function removeGroup(gid){if(!ready())return;const g=group(gid);if(!g)return;if(!confirm(`確定刪除「${g.name}」及其中 ${g.items.length} 個項目嗎？`))return;groups=groups.filter(x=>x.id!==gid);save();render()}
function removeItem(gid,iid){if(!ready())return;const g=group(gid),i=g?.items.find(x=>x.id===iid);if(!i||!confirm(`確定刪除「${i.name}」嗎？`))return;g.items=g.items.filter(x=>x.id!==iid);save();render()}
function toggleDone(gid,iid){if(!ready())return;const i=group(gid)?.items.find(x=>x.id===iid);if(i){i.done=!i.done;save();render()}}
$('#addGroup').addEventListener('click',()=>openGroup(null));$('#cancel').addEventListener('click',close);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(groups,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='地理科解析目錄備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});$('#import').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async e=>{if(!ready())return;const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('備份檔案過大');return}try{const data=JSON.parse(await file.text());if(!valid(data))throw Error();if(!confirm('匯入會取代目前所有分類與項目，確定繼續嗎？'))return;groups=data;save();render();toast('已送出雲端同步')}catch{toast('檔案格式不正確，匯入失敗')}});
$('#signIn').addEventListener('click',async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status('⚠️ 登入失敗：'+e.message)}});
$('#signOut').addEventListener('click',()=>signOut(auth));
$('#migrate').addEventListener('click',()=>{if(!ready()||!oldGroups)return;if(remoteExists&&!confirm('雲端已有資料。確定用這台裝置的舊資料覆蓋雲端嗎？'))return;groups=oldGroups;save();render();$('#migrate').hidden=true});
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}user=u;loaded=false;remoteExists=false;$('#signIn').hidden=!!u;$('#signOut').hidden=!u;$('#migrate').hidden=true;groups=defaults;render();if(!u){status('🔐 請先使用 Google 登入，並在各裝置使用同一帳號');return}status('☁️ 正在載入雲端資料…');unsub=onSnapshot(ref,snap=>{if(snap.metadata.hasPendingWrites)return;remoteExists=snap.exists();const data=snap.data()?.groups;if(snap.exists()&&!valid(data)){loaded=false;status('⚠️ 雲端資料格式錯誤，已暫停編輯');return}groups=remoteExists?data:defaults.map(g=>({...g,items:[]}));loaded=true;$('#migrate').hidden=!oldGroups;status(remoteExists?'☁️ 已連線，即時同步中':'☁️ 雲端目前沒有資料，可開始新增分類');render()},err=>{loaded=false;status('⚠️ 無法讀取雲端：'+err.message)})});
render();
})();
</script></body></html>
